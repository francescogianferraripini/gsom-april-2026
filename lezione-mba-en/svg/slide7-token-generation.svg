<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490">
  <defs>
    <!-- Standard arrow, muted (inter-row connectors) -->
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dddddd" stroke-width="1.5"/>
    </marker>
    <!-- Standard arrow, accent (cycle diagram) -->
    <marker id="arrowAccent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#a1245a" stroke-width="1.8"/>
    </marker>
    <!-- Standard arrow, muted (cycle diagram input) -->
    <marker id="arrowMuted" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#838383" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    .tok { font-family: 'Courier New', 'Consolas', monospace; font-size: 14px; }
    .ctx { fill: #555555; }
    .gen { fill: #a1245a; font-weight: bold; }
    .label-accent { font-family: Arial, Helvetica, sans-serif; fill: #a1245a; }
    .label-muted { font-family: Arial, Helvetica, sans-serif; fill: #838383; }
  </style>

  <!-- LEGEND -->
  <rect x="260" y="0" width="14" height="14" rx="3" ry="3" fill="#f0f0f0" stroke="#dddddd" stroke-width="1"/>
  <text x="280" y="12" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#838383">context (model input)</text>
  <rect x="470" y="0" width="14" height="14" rx="3" ry="3" fill="#a1245a" opacity="0.30" stroke="#a1245a" stroke-width="1"/>
  <text x="490" y="12" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#838383">generated token (output)</text>

  <!-- Row 1 -->
  <rect x="337" y="28" width="45" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="344" y="30" width="31" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="347" y="48" class="tok gen">The</text>
  <line x1="360" y1="60" x2="360" y2="68" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 2 -->
  <rect x="321" y="70" width="79" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="361" y="72" width="31" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="331" y="90" class="tok" xml:space="preserve"><tspan class="ctx">The </tspan><tspan class="gen">cat</tspan></text>
  <line x1="360" y1="102" x2="360" y2="110" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 3 -->
  <rect x="308" y="112" width="104" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="382" y="114" width="23" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="318" y="132" class="tok" xml:space="preserve"><tspan class="ctx">The cat </tspan><tspan class="gen">is</tspan></text>
  <line x1="360" y1="144" x2="360" y2="152" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 4 -->
  <rect x="295" y="154" width="129" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="395" y="156" width="23" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="305" y="174" class="tok" xml:space="preserve"><tspan class="ctx">The cat is </tspan><tspan class="gen">on</tspan></text>
  <line x1="360" y1="186" x2="360" y2="194" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 5 -->
  <rect x="279" y="196" width="163" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="403" y="198" width="31" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="289" y="216" class="tok" xml:space="preserve"><tspan class="ctx">The cat is on </tspan><tspan class="gen">the</tspan></text>
  <line x1="360" y1="228" x2="360" y2="236" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 6 -->
  <rect x="253" y="238" width="213" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="412" y="240" width="48" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="263" y="258" class="tok" xml:space="preserve"><tspan class="ctx">The cat is on the </tspan><tspan class="gen">table</tspan></text>
  <line x1="360" y1="270" x2="360" y2="278" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 7 -->
  <rect x="237" y="280" width="247" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="445" y="282" width="31" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="247" y="300" class="tok" xml:space="preserve"><tspan class="ctx">The cat is on the table </tspan><tspan class="gen">and</tspan></text>
  <line x1="360" y1="312" x2="360" y2="320" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 8 -->
  <rect x="207" y="322" width="306" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="449" y="324" width="56" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="217" y="342" class="tok" xml:space="preserve"><tspan class="ctx">The cat is on the table and </tspan><tspan class="gen">sleeps</tspan></text>
  <line x1="360" y1="354" x2="360" y2="362" stroke="#dddddd" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <!-- Row 9 -->
  <rect x="203" y="364" width="314" height="30" rx="6" ry="6" fill="#f0f0f0"/>
  <rect x="496" y="366" width="14" height="26" rx="4" ry="4" fill="#a1245a" opacity="0.22"/>
  <text x="213" y="384" class="tok" xml:space="preserve"><tspan class="ctx">The cat is on the table and sleeps</tspan><tspan class="gen">.</tspan></text>
  <rect x="523" y="369" width="44" height="20" rx="4" ry="4" fill="#a1245a" opacity="0.18" stroke="#a1245a" stroke-width="1"/>
  <text x="545" y="383" font-size="10" font-weight="bold" text-anchor="middle" class="label-accent">STOP</text>
  <path d="M 195,30 L 185,30 L 185,204 L 175,212 L 185,220 L 185,394 L 195,394" fill="none" stroke="#838383" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="0" y="0" font-size="12" class="label-muted" text-anchor="middle" transform="translate(162, 212) rotate(-90)">the context grows one token at a time</text>

  <!-- BOTTOM: STOP label -->
  <rect x="195" y="420" width="330" height="30" rx="6" ry="6" fill="#a1245a" opacity="0.12" stroke="#a1245a" stroke-width="1"/>
  <text x="360" y="440" font-size="13" font-weight="bold" text-anchor="middle" class="label-accent">STOP token &#x2192; end of generation</text>

  <!-- ── RIGHT SIDE: LOOP CYCLE DIAGRAM ── -->

  <!-- Separator -->
  <line x1="572" y1="20" x2="572" y2="406" stroke="#dddddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Title -->
  <text x="800" y="118" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#838383" text-anchor="middle" font-style="italic">each row = one call to the model:</text>

  <!-- ① Contesto box -->
  <text x="654" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#838383">①</text>
  <rect x="650" y="152" width="110" height="38" rx="6" fill="#f5f5f5" stroke="#dddddd" stroke-width="1.5"/>
  <text x="705" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="middle">context</text>

  <!-- Arrow: contesto → LLM -->
  <line x1="760" y1="171" x2="836" y2="171" stroke="#838383" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
  <text x="798" y="165" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#838383" text-anchor="middle">input</text>

  <!-- ② LLM box -->
  <text x="840" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#838383">②</text>
  <rect x="836" y="152" width="90" height="38" rx="6" fill="#f5f5f5" stroke="#a1245a" stroke-width="1.5"/>
  <text x="881" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#a1245a" text-anchor="middle">LLM</text>

  <!-- Arrow: LLM → token (downward) -->
  <line x1="881" y1="190" x2="881" y2="232" stroke="#a1245a" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="908" y="216" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#a1245a">1 token</text>

  <!-- ③ Token box -->
  <text x="840" y="228" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#838383">③</text>
  <rect x="836" y="232" width="90" height="28" rx="4" fill="#a1245a" opacity="0.18" stroke="#a1245a" stroke-width="1"/>
  <text x="881" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#a1245a" text-anchor="middle">token</text>

  <!-- ④ Return arrow: token left → down-around → into contesto from left -->
  <path d="M 836,246 L 618,246 L 618,171 L 650,171" fill="none" stroke="#a1245a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowAccent)"/>
  <text x="727" y="264" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#a1245a" text-anchor="middle">④ appended to the context</text>

  <!-- Loop footer -->
  <text x="800" y="310" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#838383" text-anchor="middle" font-style="italic">&#x21BB;  repeats until the STOP token</text>
</svg>
