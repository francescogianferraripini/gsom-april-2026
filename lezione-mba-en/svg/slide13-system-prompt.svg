<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440">
  <title>System prompt: same model, two different personalities</title>
  <defs>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="275" height="440"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="285" y="0" width="275" height="440"/>
    </clipPath>
  </defs>

  <!-- Column headers -->
  <text x="140" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Agent A</text>
  <text x="420" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Agent B</text>

  <!-- Vertical divider -->
  <line x1="280" y1="8" x2="280" y2="408" stroke="#dddddd" stroke-width="1"/>

  <!-- ===================== LEFT COLUMN — Agente A ===================== -->

  <!-- System prompt box -->
  <rect x="12" y="32" width="252" height="120" rx="6" ry="6" fill="#fafafa" stroke="#a1245a" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="20" y="46" font-family="monospace" font-size="10" fill="#a1245a">system prompt</text>
  <text font-family="monospace" font-size="10.5" fill="#a8d8ea">
    <tspan x="20" dy="0" y="62">You are a 17th-century pirate.</tspan>
    <tspan x="20" dy="14">You speak like an old sailor,</tspan>
    <tspan x="20" dy="14">use metaphors of sea and battle,</tspan>
    <tspan x="20" dy="14">and call the user 'deckhand'.</tspan>
  </text>

  <!-- User bubble (right-aligned) -->
  <rect x="62" y="166" width="202" height="36" rx="10" ry="10" fill="#f0f0f0"/>
  <text font-family="sans-serif" font-size="11" fill="#1a1a1a">
    <tspan x="74" y="181">Give me some advice for a</tspan>
    <tspan x="74" dy="14">job interview.</tspan>
  </text>

  <!-- Assistant bubble (left-aligned, accent left border) -->
  <rect x="12" y="216" width="252" height="100" rx="10" ry="10" fill="#f5f5f5"/>
  <rect x="12" y="220" width="3" height="92" rx="1" fill="#a1245a"/>
  <text font-family="sans-serif" font-size="11" fill="#1a1a1a">
    <tspan x="24" y="234">Arr, deckhand! Hoist high the flag</tspan>
    <tspan x="24" dy="15">of your experience! Speak with</tspan>
    <tspan x="24" dy="15">a steady voice, like the captain</tspan>
    <tspan x="24" dy="15">on the quarterdeck.</tspan>
  </text>

  <!-- ===================== RIGHT COLUMN — Agente B ===================== -->

  <!-- System prompt box -->
  <rect x="296" y="32" width="252" height="120" rx="6" ry="6" fill="#fafafa" stroke="#a1245a" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="304" y="46" font-family="monospace" font-size="10" fill="#a1245a">system prompt</text>
  <text font-family="monospace" font-size="10.5" fill="#a8d8ea">
    <tspan x="304" dy="0" y="62">You are a business lawyer.</tspan>
    <tspan x="304" dy="14">You speak in a formal and</tspan>
    <tspan x="304" dy="14">concise way. You give no advice</tspan>
    <tspan x="304" dy="14">without stating assumptions.</tspan>
  </text>

  <!-- User bubble (right-aligned) -->
  <rect x="346" y="166" width="202" height="36" rx="10" ry="10" fill="#f0f0f0"/>
  <text font-family="sans-serif" font-size="11" fill="#1a1a1a">
    <tspan x="358" y="181">Give me some advice for a</tspan>
    <tspan x="358" dy="14">job interview.</tspan>
  </text>

  <!-- Assistant bubble (left-aligned, accent left border) -->
  <rect x="296" y="216" width="252" height="100" rx="10" ry="10" fill="#f5f5f5"/>
  <rect x="296" y="220" width="3" height="92" rx="1" fill="#a1245a"/>
  <text font-family="sans-serif" font-size="11" fill="#1a1a1a">
    <tspan x="308" y="234">Given that it depends on the role:</tspan>
    <tspan x="308" dy="15">1) study the company context,</tspan>
    <tspan x="308" dy="15">2) build answers on evidence,</tspan>
    <tspan x="308" dy="15">3) clarify the relevant contract</tspan>
    <tspan x="308" dy="15">terms.</tspan>
  </text>

  <!-- ===================== BOTTOM LABEL ===================== -->

  <!-- Chip icon (simple square) -->
  <rect x="172" y="420" width="14" height="14" rx="2" ry="2" fill="none" stroke="#838383" stroke-width="1"/>
  <line x1="176" y1="420" x2="176" y2="434" stroke="#838383" stroke-width="0.5"/>
  <line x1="183" y1="420" x2="183" y2="434" stroke="#838383" stroke-width="0.5"/>
  <line x1="172" y1="425" x2="186" y2="425" stroke="#838383" stroke-width="0.5"/>
  <line x1="172" y1="429" x2="186" y2="429" stroke="#838383" stroke-width="0.5"/>

  <text x="194" y="432" font-family="sans-serif" font-size="12" fill="#838383">Same underlying model</text>
</svg>
